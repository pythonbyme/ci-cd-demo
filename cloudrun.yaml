apiVersion: serving.knative.dev/v1
kind: Service

metadata:
  name: ci-cd-demo

spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"

  spec:
    containerConcurrency: 80

    containers:
      - image: IMAGE_URL

        ports:
          - containerPort: 8080
        resources:
          limits:
            cpu: "1"
            memory: 512Mi